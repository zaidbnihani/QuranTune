name: Build & Release Android APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: Build Signed APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
          validate-wrappers: false

      - name: Prepare Gradle Wrapper
        run: |
          gradle wrapper --gradle-version 9.3.1 --distribution-type bin
          chmod +x gradlew

      - name: Ensure Debug Keystore Exists
        run: |
          if [ ! -f "debug.keystore" ]; then
            echo "Generating fallback debug keystore in root..."
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Setup Custom Keystore (Optional Secrets)
        run: |
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "Decoding release keystore from GitHub Secrets..."
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > release.keystore
            echo "KEYSTORE_PATH=${GITHUB_WORKSPACE}/release.keystore" >> $GITHUB_ENV
            echo "STORE_PASSWORD=${{ secrets.STORE_PASSWORD }}" >> $GITHUB_ENV
            echo "KEY_ALIAS=${{ secrets.KEY_ALIAS }}" >> $GITHUB_ENV
            echo "KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}" >> $GITHUB_ENV
          fi

      - name: Ensure google-services.json Exists
        run: |
          if [ -n "${{ secrets.GOOGLE_SERVICES_JSON }}" ]; then
            echo "Using GOOGLE_SERVICES_JSON from secrets..."
            echo "${{ secrets.GOOGLE_SERVICES_JSON }}" > app/google-services.json
          elif [ ! -f "app/google-services.json" ]; then
            echo "Generating fallback app/google-services.json..."
            mkdir -p app
            echo '{"project_info":{"project_number":"847919276303","project_id":"quran-player-47edf","storage_bucket":"quran-player-47edf.firebasestorage.app"},"client":[{"client_info":{"mobilesdk_app_id":"1:847919276303:android:cf9b5a860830fecbe15e7a","android_client_info":{"package_name":"com.aistudio.quranplayer.shmrzp"}},"oauth_client":[],"api_key":[{"current_key":"AIzaSyBbGAZWsyKpAByNFKjYHAy_K3rY-_hWXus"}],"services":{"appinvite_service":{"other_platform_oauth_client":[]}}}],"configuration_version":"1"}' > app/google-services.json
          fi

      - name: Build Release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Prepare APK Output Name
        run: |
          VERSION_NAME=$(grep 'versionName' app/build.gradle.kts | head -n 1 | awk -F '"' '{print $2}')
          if [ -z "$VERSION_NAME" ]; then VERSION_NAME="2.7.3"; fi
          
          mkdir -p artifacts
          cp app/build/outputs/apk/release/app-release.apk "artifacts/QuranPlayer-v${VERSION_NAME}.apk"
          echo "APK_PATH=artifacts/QuranPlayer-v${VERSION_NAME}.apk" >> $GITHUB_ENV
          echo "VERSION_NAME=${VERSION_NAME}" >> $GITHUB_ENV

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: QuranPlayer-v${{ env.VERSION_NAME }}-APK
          path: ${{ env.APK_PATH }}
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release v${{ env.VERSION_NAME }}
          body: |
            ## Quran Player Release v${{ env.VERSION_NAME }}
            
            - Automatically compiled and signed APK build.
            - Includes updated UI, performance enhancements, and new app icon.
          files: ${{ env.APK_PATH }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
